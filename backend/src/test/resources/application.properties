# ==============================================================================
# Distributed Auction Engine - Unit & Integration Test Configuration
# Uses H2 In-Memory Database with MySQL emulation mode
# ==============================================================================

spring.application.name=distributed-auction-engine-test

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:livebid_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-initialize schema for tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Config for tests
jwt.secret=DistributedAuctionEngineSuperSecretJwtKey256BitSecureRandomString2026
jwt.expiration-ms=3600000

# Redis configuration for tests (listener disabled)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1000ms
spring.data.redis.listener.auto-startup=false

# Auction defaults for tests
auction.anti-snipe.window-minutes=2
auction.anti-snipe.extension-minutes=2
auction.bidding.max-retries=3
auction.bidding.auto-bid-increment=10.00
auction.scheduler.rate-ms=60000
auction.scheduler.batch-size=10
