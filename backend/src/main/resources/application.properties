# ==============================================================================
# Distributed Auction Engine - Application Properties
# Author: Jayavignesh (jayavignesh.dev)
# ==============================================================================

spring.application.name=distributed-auction-engine
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# 1. Primary Database Configuration (PostgreSQL 16+ Default, MySQL 8 Supported)
# ------------------------------------------------------------------------------
# Default: PostgreSQL 16+
# Option:  MySQL 8 (pass DB_URL, DB_DRIVER, DB_SCHEMA_FILE via env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livebid_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Connection Pool (HikariCP) Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# Automatic Schema Initialization (schema-postgres.sql default)
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:${DB_SCHEMA_FILE:schema-postgres.sql}

# ------------------------------------------------------------------------------
# 2. Redis Distributed Layer (Sequencer & Cluster Pub/Sub)
# ------------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000ms}

# ------------------------------------------------------------------------------
# 3. Security, JWT & CORS
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:DistributedAuctionEngineSuperSecretJwtKey256BitSecureRandomString2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,*}

# ------------------------------------------------------------------------------
# 4. Auction Engine Invariants & Anti-Sniping
# ------------------------------------------------------------------------------
auction.anti-snipe.window-minutes=${ANTI_SNIPE_WINDOW_MINUTES:2}
auction.anti-snipe.extension-minutes=${ANTI_SNIPE_EXTENSION_MINUTES:2}
auction.bidding.max-retries=${BID_MAX_RETRIES:3}
auction.bidding.auto-bid-increment=${AUTO_BID_INCREMENT:10.00}
auction.scheduler.rate-ms=${CLOSING_SCHEDULER_RATE_MS:10000}
auction.scheduler.batch-size=${CLOSING_SCHEDULER_BATCH_SIZE:100}

# ------------------------------------------------------------------------------
# 5. Swagger OpenAPI 3.0 Documentation
# ------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
