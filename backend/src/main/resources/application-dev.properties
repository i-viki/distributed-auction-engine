# =============================================================================
# Local Development Profile (H2 In-Memory with MySQL Emulation)
# Run in Eclipse with: --spring.profiles.active=dev
# =============================================================================

spring.application.name=distributed-auction-engine
server.port=8080

# In-Memory Database emulating MySQL 8 dialect
spring.datasource.url=jdbc:h2:mem:livebid_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Auto-execute schema.sql on boot
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Config for local testing
jwt.secret=DistributedAuctionEngineSuperSecretJwtKey256BitSecureRandomString2026
jwt.expiration-ms=86400000


# Swagger OpenAPI Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

# Redis Distributed Layer Config (Dev)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
