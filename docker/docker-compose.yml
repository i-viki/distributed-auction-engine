services:
  # ----------------------------------------------------------------------------
  # 1. Relational Persistence Store: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: livebid-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PGTZ: ${TZ:-Asia/Kolkata}
      POSTGRES_DB: ${POSTGRES_DB:-livebid_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-livebid_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 2. In-Memory Sequencer & Pub/Sub Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: livebid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 3. Distributed Auction Engine: Spring Boot Core Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: livebid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-livebid_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_SCHEMA_FILE: schema-postgres.sql
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-ProductionDistributedAuctionEngineSecretKeyWithSufficientEntropy256Bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      ANTI_SNIPE_WINDOW_MINUTES: ${ANTI_SNIPE_WINDOW_MINUTES:-2}
      ANTI_SNIPE_EXTENSION_MINUTES: ${ANTI_SNIPE_EXTENSION_MINUTES:-2}
      BID_MAX_RETRIES: ${BID_MAX_RETRIES:-3}
      AUTO_BID_INCREMENT: ${AUTO_BID_INCREMENT:-10.00}
      CLOSING_SCHEDULER_RATE_MS: ${CLOSING_SCHEDULER_RATE_MS:-10000}
      CLOSING_SCHEDULER_BATCH_SIZE: ${CLOSING_SCHEDULER_BATCH_SIZE:-100}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 4. Real-Time Trading Floor: React 19 + Nginx Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: livebid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
