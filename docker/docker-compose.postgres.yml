version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Persistence Store: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: livebid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: livebid_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livebid_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 2. In-Memory Sequencer & Pub/Sub Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: livebid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 3. Distributed Auction Engine: Spring Boot Core Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: livebid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/livebid_db
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_SCHEMA_FILE: schema-postgres.sql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ProductionDistributedAuctionEngineSecretKeyWithSufficientEntropy256Bits
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      ANTI_SNIPE_WINDOW_MINUTES: 2
      ANTI_SNIPE_EXTENSION_MINUTES: 2
      BID_MAX_RETRIES: 3
      AUTO_BID_INCREMENT: 10.00
      CLOSING_SCHEDULER_RATE_MS: 10000
      CLOSING_SCHEDULER_BATCH_SIZE: 100
    ports:
      - "8080:8080"
    networks:
      - auction-network

volumes:
  postgres_data:
  redis_data:

networks:
  auction-network:
    driver: bridge

