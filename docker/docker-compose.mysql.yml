version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Persistence Store: MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: livebid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: livebid_db
      MYSQL_USER: livebid_user
      MYSQL_PASSWORD: livebid_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 2. In-Memory Sequencer & Pub/Sub Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: livebid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 3. Distributed Auction Engine: Spring Boot Core Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: livebid-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/livebid_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USERNAME: livebid_user
      DB_PASSWORD: livebid_password
      DB_SCHEMA_FILE: schema.sql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ProductionDistributedAuctionEngineSecretKeyWithSufficientEntropy256Bits
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - auction-network

  # ----------------------------------------------------------------------------
  # 4. Real-Time Trading Floor: React 19 + Nginx Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: livebid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

